# Frontend Deployment - React app served by Nginx
# Written as part of DevOps trainee project

apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: blog-app

spec:

  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:

    metadata:
      labels:
        app: frontend

    spec:

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
        imagePullSecrets:
        - name: ecr-secret

      containers:

      - name: frontend

        image: 122384809512.dkr.ecr.us-east-1.amazonaws.com/prod/blog-app:latest

        ports:
        - containerPort: 3000

        imagePullPolicy: Always

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        resources:

          requests:
            cpu: "200m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10

        volumeMounts:
        - name: nginx-tmp
          mountPath: /tmp

      volumes:
      - name: nginx-tmp
        emptyDir:
          sizeLimit: 64Mi
