name: Blog App DevSecOps CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "infra/**"
      - "K8's/kustomization.yaml"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/destroy.yml"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "infra/**"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/destroy.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-app-eks-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: ""
  ECR_FRONTEND_REPOSITORY: prod/blog-app
  ECR_BACKEND_REPOSITORY: prod/backend-blog-app
jobs:

  # --------------------------------------------------
  # JOB 1: SECRET SCANNING
  # --------------------------------------------------

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # --------------------------------------------------
  # JOB 2: DEPENDENCY SECURITY AUDIT
  # --------------------------------------------------

  dependency-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify package files
        working-directory: ${{ matrix.app }}
        run: |
          test -f package.json
      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm install --no-audit --no-fund

      - name: Run dependency audit
        working-directory: ${{ matrix.app }}
        run: npm audit --audit-level=high

  # --------------------------------------------------
  # JOB 3: FILESYSTEM SECURITY SCAN
  # --------------------------------------------------

  filesystem-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan filesystem
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: frontend/node_modules,infra/.terraform
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # --------------------------------------------------
  # JOB 4: APPLICATION TESTS AND BUILDS
  # --------------------------------------------------

  application-build:
    name: Application Build
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - dependency-audit
      - filesystem-scan

    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm install --no-audit --no-fund

      - name: Run application tests
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          if npm run | grep -qE '^[[:space:]]+test([[:space:]]|$)'; then
            npm test --if-present
          else
            echo "No test script configured."
          fi
      - name: Build frontend
        if: matrix.app == 'frontend'
        working-directory: frontend
        run: npm run build

  # --------------------------------------------------
  # JOB 5: BUILD, SCAN AND PUSH DOCKER IMAGES
  # --------------------------------------------------

  docker-publish:
    name: Docker Build, Scan and Push
    runs-on: ubuntu-latest

    needs:
      - application-build

    # Only publish images from pushes to main.
    # Pull requests must not receive AWS credentials.

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ steps.image-tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: image-tag
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # AWS authentication uses GitHub OIDC. The secret can override the Terraform-created role ARN.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR repositories
        env:
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          aws ecr describe-repositories \
            --repository-names \
              "${ECR_FRONTEND_REPOSITORY}" \
              "${ECR_BACKEND_REPOSITORY}"
      - name: Build frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker build \
            --pull \
            -t "$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" \
            ./frontend
      - name: Build backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker build \
            --pull \
            -t "$REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" \
            ./backend
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Push frontend image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker push "$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"
      - name: Push backend image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker push "$REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"
  # --------------------------------------------------
  # JOB 6: UPDATE GITOPS MANIFESTS
  # --------------------------------------------------

  update-gitops:
    name: Update Kubernetes Image Tags
    runs-on: ubuntu-latest

    needs:
      - docker-publish

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    # This job only updates Git.
    # It does not need AWS credentials.

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Verify Kustomize configuration
        run: |
          test -f "K8's/kustomization.yaml"
          kustomize build "K8's" > /tmp/rendered-manifests.yaml
      - name: Update frontend and backend image tags
        working-directory: "K8's"
        env:
          REGISTRY: ${{ needs.docker-publish.outputs.registry }}
          IMAGE_TAG: ${{ needs.docker-publish.outputs.image_tag }}
        run: |
          kustomize edit set image \
            "$REGISTRY/$ECR_FRONTEND_REPOSITORY=$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"
          kustomize edit set image \
            "$REGISTRY/$ECR_BACKEND_REPOSITORY=$REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"
          kustomize build . > /tmp/rendered-manifests.yaml
      - name: Commit GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "K8's/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi
          git commit -m "chore(gitops): deploy ${GITHUB_SHA}"
          git push origin HEAD:main
  # --------------------------------------------------
  # JOB 7: VERIFY ARGO CD DEPLOYMENT
  # --------------------------------------------------

  deployment-notice:
    name: GitOps Update Complete
    runs-on: ubuntu-latest

    needs:
      - deployment-verification

    steps:
      - name: Report successful deployment
        run: |
          echo "The application is healthy on EKS and its frontend endpoint passed the smoke test."

  deployment-verification:
    name: Verify EKS Deployment
    runs-on: ubuntu-latest

    needs:
      - docker-publish
      - update-gitops

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name blog-prod-eks --region "$AWS_REGION"

      - name: Wait for GitOps images and healthy workloads
        env:
          REGISTRY: ${{ needs.docker-publish.outputs.registry }}
          IMAGE_TAG: ${{ needs.docker-publish.outputs.image_tag }}
        shell: bash
        run: |
          expected_frontend="$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"
          expected_backend="$REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"

          for attempt in $(seq 1 90); do
            frontend_image=$(kubectl get deployment frontend -n blog-app \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            backend_image=$(kubectl get deployment backend -n blog-app \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)

            if [[ "$frontend_image" == "$expected_frontend" && "$backend_image" == "$expected_backend" ]]; then
              break
            fi

            if [[ "$attempt" -eq 90 ]]; then
              echo "Argo CD did not apply the expected image tags."
              echo "Frontend image: $frontend_image"
              echo "Backend image: $backend_image"
              exit 1
            fi
            sleep 10
          done

          kubectl rollout status deployment/frontend -n blog-app --timeout=10m
          kubectl rollout status deployment/backend -n blog-app --timeout=10m
          kubectl rollout status statefulset/mysql -n blog-app --timeout=10m

      - name: Smoke test frontend load balancer
        shell: bash
        run: |
          endpoint=""
          for attempt in $(seq 1 60); do
            endpoint=$(kubectl get service frontend-service -n blog-app \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}{.status.loadBalancer.ingress[0].ip}')
            if [[ -n "$endpoint" ]]; then
              break
            fi
            sleep 10
          done

          if [[ -z "$endpoint" ]]; then
            echo "Frontend load balancer did not receive an endpoint."
            exit 1
          fi

          curl --fail --retry 12 --retry-connrefused --retry-delay 5 \
            --max-time 15 "http://$endpoint/"
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 5 --max-time 15 "http://$endpoint/api/posts" |
            jq -e 'type == "array"'